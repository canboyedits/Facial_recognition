<rect x="70" y="555" width="1105" height="70" rx="18" fill="#182235"/><text x="622" y="600" text-anchor="middle" font-family="Arial" font-size="25" fill="#fff">The project does not “learn” a person from scratch—it computes an embedding from one reference image and compares later faces against it.</text>
