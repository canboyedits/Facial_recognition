<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="40" font-weight="700" fill="#0f172a">One reference image, many comparisons</text>
<rect x="70" y="160" width="260" height="310" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
<circle cx="200" cy="270" r="70" fill="#dbeafe"/><circle cx="175" cy="255" r="8" fill="#1d4ed8"/><circle cx="225" cy="255" r="8" fill="#1d4ed8"/><path d="M170 300q30 25 60 0" fill="none" stroke="#1d4ed8" stroke-width="7"/>
<text x="200" y="390" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Uploaded image</text><text x="200" y="425" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Build one known encoding</text>
<path d="M350 315h145" stroke="#94a3b8" stroke-width="6" marker-end="url(#m)"/>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#94a3b8"/></marker></defs>
<rect x="510" y="160" width="620" height="310" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
<g font-family="Arial">
<circle cx="650" cy="270" r="55" fill="#dcfce7"/><text x="650" y="280" text-anchor="middle" font-size="38">✓</text><text x="650" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Match</text>
<circle cx="820" cy="270" r="55" fill="#fee2e2"/><text x="820" y="280" text-anchor="middle" font-size="38">×</text><text x="820" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">No match</text>
<circle cx="990" cy="270" r="55" fill="#fef3c7"/><text x="990" y="280" text-anchor="middle" font-size="34">?</text><text x="990" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">Uncertain</text>
</g>
<text x="820" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Lighting, pose, blur and threshold affect the result.</text>
</svg>
